# Orchestr8 contract — Project Manager
# Schema: config/contract.schema.json  (ADR 0002 · O0)
# Autonomy A: tools are read/propose-only until O1/O2.
id: project_manager
version: 1
mission: Tracks progress, blockers, dependencies, and milestones
inputs:
  task_types:
  - '*'
  requires_context: false
allowed_tools: []
outputs:
  schema: standard_agent_v1
  required_fields:
  - summary
  - confidence
confidence:
  required: true
  min: 0.0
  max: 1.0
  escalate_below: 0.5
failure_behavior: escalate
escalation:
  to:
  - critic
  when:
  - low_confidence
  - tool_error
high_impact: false
enabled: true
