# Orchestr8 contract — Pricing Agent
# Schema: config/contract.schema.json  (ADR 0002 · O0)
# ADR 0003: Orchestr8 authors specs; Cursor builds. Tools are read-only.
id: pricing_agent
version: 2
mission: Fair market value ranges from snapshot anchors and adjustments
inputs:
  task_types:
  - '*'
  requires_context: true
allowed_tools: []
outputs:
  schema: standard_agent_v1
  required_fields:
  - summary
  - confidence
confidence:
  required: true
  min: 0.0
  max: 1.0
  escalate_below: 0.6
failure_behavior: escalate
escalation:
  to:
  - critic
  when:
  - low_confidence
  - high_impact
  - tool_error
high_impact: true
enabled: true
