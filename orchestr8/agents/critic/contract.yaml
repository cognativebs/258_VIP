# Orchestr8 contract — Critic
# Schema: config/contract.schema.json  (ADR 0002 · O0)
# Autonomy A: tools are read/propose-only until O1/O2.
id: critic
version: 1
mission: Stress-tests assumptions, overconfidence, and missing evidence
inputs:
  task_types:
  - '*'
  requires_context: true
allowed_tools:
- read_file
- git_diff
outputs:
  schema: standard_agent_v1
  required_fields:
  - summary
  - confidence
  - verdict
confidence:
  required: true
  min: 0.0
  max: 1.0
  escalate_below: 0.5
failure_behavior: degrade
escalation:
  to:
  - human
  when:
  - low_confidence
  - tool_error
high_impact: false
enabled: true
