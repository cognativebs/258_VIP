# Orchestr8 contract — Architect
# Schema: config/contract.schema.json  (ADR 0002 · O0)
# Autonomy A: tools are read/propose-only until O1/O2.
id: architect
version: 1
mission: Designs VIP / Orchestr8 / app system boundaries and contracts
inputs:
  task_types:
  - '*'
  requires_context: false
allowed_tools:
- read_file
- list_dir
- grep
- git_diff
outputs:
  schema: standard_agent_v1
  required_fields:
  - summary
  - confidence
confidence:
  required: true
  min: 0.0
  max: 1.0
  escalate_below: 0.5
failure_behavior: degrade
escalation:
  to:
  - critic
  when:
  - low_confidence
  - tool_error
high_impact: false
enabled: true
