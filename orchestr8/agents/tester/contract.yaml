# Orchestr8 contract — Tester
# Schema: config/contract.schema.json  (ADR 0002 · O0)
# ADR 0003: Orchestr8 authors specs; Cursor builds. Tools are read-only.
id: tester
version: 2
mission: Breaks workflows and recommendations with edge cases
inputs:
  task_types:
  - '*'
  requires_context: false
allowed_tools:
- read_file
- list_dir
- grep
- git_diff
outputs:
  schema: standard_agent_v1
  required_fields:
  - summary
  - confidence
  - verdict
confidence:
  required: true
  min: 0.0
  max: 1.0
  escalate_below: 0.5
failure_behavior: degrade
escalation:
  to:
  - human
  when:
  - low_confidence
  - tool_error
high_impact: false
enabled: true
